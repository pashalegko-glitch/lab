<script>
(function(){
  function err(code){var e=new Error(code);e.code=code;return e}
  async function share(files){
    if(!/iPhone|iPad|iPod|Android/.test(navigator.userAgent))return false;
    if(navigator.canShare&&navigator.canShare({files:files})){
      try{await navigator.share({files:files})}catch(e){throw err(e&&e.name==="AbortError"?"declined":"unavailable")}
      return true}
    return false}
  function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}
  var downloads={save:async function(o){var f=new File([o.data],o.filename,{type:o.data.type||"application/octet-stream"});if(!(await share([f])))dl(o.data,o.filename)}};
  window.claude={use:async function(n){return n==="downloads"?downloads:null}};
  window.LAB_SAVE_MANY=async function(list){
    var files=list.map(function(x){return new File([x.data],x.filename,{type:"image/jpeg"})});

    list.forEach(function(x,i){setTimeout(function(){dl(x.data,x.filename)},i*400)});

:root{

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111312; --surface:#1A1D1B; --ink:#E6E8E3; --muted:#8D938E; --line:#2C302D;
  --accent:#8193FF; --accent-ink:#0C0F24; --stage:#0A0B0A; --stage-ink:#D8DBD5; --chip:#232724; --warn:#F0C77E; --warn-bg:#2E2614; color-scheme:dark}}

button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);align-items:start;column-gap:28px}.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;grid-column:1/-1}
.mark{font:800 34px/1 var(--f-mark);letter-spacing:-.03em;margin:0}
.mark span{color:var(--accent)}
.status{font:12px var(--f-mono);color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.busy::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.left,.right{display:grid;gap:14px;min-width:0}
/* кадр */
.stage{position:relative;background:var(--stage);border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%;max-height:64vh;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.stage .orig{opacity:0}
.stage.peek .orig{opacity:1}
.stage.peek .res{opacity:0}
.badge{position:absolute;left:10px;top:10px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--stage-ink);background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px}

.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--stage-ink);background:transparent;border:0;font:inherit;font-size:14px;line-height:1.45;cursor:pointer}

.hint{font-size:12.5px;color:var(--muted);margin:0}

.label{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px}

  const notes=[], d=ph&&ph.out&&ph.diag||{};
  if(d.krugiSkipped)notes.push("Круги пропущены: человек в кадре не найден.");
  if(d.krugi){if(d.krugi.area<.03)notes.push("Круги: человек почти не найден, лучше взять другое фото.");
    else if(d.krugi.nBig>1)notes.push("Круги: в кадре несколько фигур, фильтр рассчитан на одного человека.");
    if(d.krugi.soft>.10)notes.push("Круги: размытый контур, вырезка выйдет грязной. Лучше резкий кадр.");}
  if(d.smazCenter)notes.push("Смаз: фигура не найдена, резкая зона в центре кадра.");
  $("note").textContent=notes.join(" ");$("note").hidden=!notes.length;
}

/* ---------- обработка ---------- */
function run(){gen++;queue=photos.map(p=>p.id);if(photos[cur]){const id=photos[cur].id;queue=[id].concat(queue.filter(x=>x!==id))}pump()}
let debounce;function runSoon(){clearTimeout(debounce);debounce=setTimeout(run,220)}
function pump(){
  if(running)return;
  if(!queue.length){const n=photos.length;setStatus(n?(n===1?"Готово":"Готово: "+n+" фото"):"Добавь фото");refresh();return}
  const id=queue.shift(), ph=photos.find(p=>p.id===id);if(!ph){pump();return}
  if(!ph.src||ph.srcSize!==srcKey(ph))prepare(ph);
  if(needsMask()&&ph.mask===undefined){
    running={id,gen,wait:true};
    setStatus(netMode?"Ищу человека в кадре…":"Загружаю нейросеть, это один раз…",true);
    getMask(ph).then(m=>{ph.mask=m;running=null;if(!queue.includes(id))queue.unshift(id);pump()});
    return;
  }
  running={id,gen};
  const done=photos.length-queue.length;
  setStatus("Проявляю"+(photos.length>1?" "+done+"/"+photos.length:"")+"…",true);
  const buf=ph.src.data.data.slice().buffer, mb=ph.mask?ph.mask.slice().buffer:null;
  worker.postMessage({job:id,w:ph.src.w,h:ph.src.h,data:buf,chain:activeChain(),seed:ph.seed,mask:mb},mb?[buf,mb]:[buf]);
}

/* ---------- нейросеть: поиск человека (общая для Кругов и Смаза) ---------- */
let netMode=null, netP=null;
function needsMask(){return activeChain().some(c=>c.id==="krugi"||(c.id==="smaz"&&c.p.zone==="figure"))}
function ensureNet(){if(!netP)netP=SMAZ.segLoad("./").then(m=>{netMode=m;return m});return netP}
async function getMask(ph){
  const mode=await ensureNet();
  if(mode!=="gpu"&&mode!=="cpu"){setStatus("Нейросеть не запустилась: "+(SMAZ.SEG.err||"причина неизвестна"));return null}
  try{
    const S=320,c=document.createElement("canvas");c.width=S;c.height=S;
    const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(ph.src.canvas,0,0,S,S);
    const d=x.getImageData(0,0,S,S).data, inp=new Float32Array(S*S*3), mu=[.485,.456,.406], sd=[.229,.224,.225];
    for(let i=0;i<S*S;i++)for(let k=0;k<3;k++)inp[i*3+k]=(d[i*4+k]/255-mu[k])/sd[k];
    await new Promise(r=>setTimeout(r,30));
    const m=mode==="gpu"?SMAZ.segRun(inp):await SMAZ.cpuRun(inp);
    let mn=Infinity,mx=-Infinity;for(const v of m){if(v<mn)mn=v;if(v>mx)mx=v}
    for(let i=0;i<m.length;i++)m[i]=(m[i]-mn)/(mx-mn+1e-6);
    return m;
  }catch(e){console.warn(e);return null}
}

worker.onmessage=e=>{
  const m=e.data, r=running;running=null;
  if(m.error){setStatus("Ошибка обработки: "+m.error)}
  else if(r&&r.gen===gen){
    const ph=photos.find(p=>p.id===m.job);
    if(ph){ph.diag=m.diag||{};const c=document.createElement("canvas");c.width=m.w;c.height=m.h;
      c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(m.data),m.w,m.h),0,0);
      c.toBlob(blob=>{
        if(ph.out&&ph.out.url)URL.revokeObjectURL(ph.out.url);
        ph.out={blob,url:URL.createObjectURL(blob),w:m.w,h:m.h,gen:r.gen};
        ph.el.querySelector("img").src=ph.out.url;
        if(photos[cur]===ph)showCurrent();
        refresh();
      },"image/jpeg",.92);
    }
  }
  pump();
};

/* ---------- пульт ---------- */
function renderChain(){
  const box=$("chain");box.textContent="";
  $("chainCount").textContent=chain.length?chain.length+" из "+ORDER.filter(k=>FILTERS[k].ready).length:"";
  if(!chain.length){const s=document.createElement("span");s.className="chain-empty";s.textContent="Пусто. Добавь фильтр из списка ниже.";box.appendChild(s)}
  chain.forEach((c,i)=>{
    if(i){const a=document.createElement("span");a.className="arrow";a.textContent="→";box.appendChild(a)}
    const b=document.createElement("button");b.type="button";b.className="link"+(c.on?"":" off");
    b.setAttribute("aria-pressed",String(i===sel));
    b.innerHTML='<span class="n">'+(i+1)+'</span><span></span>';b.lastChild.textContent=FILTERS[c.id].name;
    b.addEventListener("click",()=>{sel=i;renderAll()});box.appendChild(b);
  });
}
function renderPanel(){
  const p=$("panel"), c=chain[sel];
  if(!c){p.hidden=true;return}
  p.hidden=false;p.textContent="";const F=FILTERS[c.id];
  const head=document.createElement("div");head.className="panel-head";
  head.innerHTML='<h2></h2><label class="switch"><input type="checkbox" id="onoff"> Включён</label>';
  head.querySelector("h2").textContent=F.name;head.querySelector("input").checked=c.on;
  head.querySelector("input").addEventListener("change",e=>{c.on=e.target.checked;changed(true)});
  p.appendChild(head);
  F.params.forEach(prm=>{
    const id="p-"+c.id+"-"+prm.k, w=document.createElement("div");w.className="ctl";
    if(prm.type==="seg"){
      w.innerHTML='<div class="row"><label></label></div><div class="seg" role="group"></div>';
      w.querySelector("label").textContent=prm.l;const g=w.querySelector(".seg");g.setAttribute("aria-label",prm.l);
      prm.opts.forEach(([v,t])=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("aria-pressed",String(c.p[prm.k]===v));
        b.addEventListener("click",()=>{if(c.p[prm.k]!==v){c.p[prm.k]=v;changed(true)}});g.appendChild(b)});
      p.appendChild(w);return;
    }
    w.innerHTML='<div class="row"><label></label><output></output></div><input type="range">';
    const lab=w.querySelector("label"), out=w.querySelector("output"), inp=w.querySelector("input");
    lab.textContent=prm.l;lab.htmlFor=id;inp.id=id;inp.min=prm.min;inp.max=prm.max;inp.step=prm.step;inp.value=c.p[prm.k];
    out.textContent=prm.f(c.p[prm.k]);
    inp.addEventListener("input",()=>{c.p[prm.k]=+inp.value;out.textContent=prm.f(c.p[prm.k]);changed(false)});
    p.appendChild(w);
  });
  const acts=document.createElement("div");acts.className="acts";
  const mk=(t,fn,dis)=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=t;b.disabled=!!dis;b.addEventListener("click",fn);acts.appendChild(b)};
  mk("← Раньше",()=>{if(sel>0){[chain[sel-1],chain[sel]]=[chain[sel],chain[sel-1]];sel--;changed(true)}},sel===0);
  mk("Позже →",()=>{if(sel<chain.length-1){[chain[sel+1],chain[sel]]=[chain[sel],chain[sel+1]];sel++;changed(true)}},sel===chain.length-1);
  mk("Сбросить",()=>{c.p=defaults(c.id);changed(true)});
  mk("Убрать",()=>{chain.splice(sel,1);sel=Math.min(sel,chain.length-1);changed(true)});
  p.appendChild(acts);
}
function renderLib(){
  const box=$("lib");box.textContent="";
  ORDER.forEach(id=>{
    const F=FILTERS[id], inChain=chain.findIndex(c=>c.id===id);
    const b=document.createElement("button");b.type="button";b.className="tile"+(inChain>=0?" in":"");b.disabled=!F.ready;
    b.innerHTML="<b></b><small></small>";b.firstChild.textContent=F.name;
    b.lastChild.textContent=!F.ready?F.note:inChain>=0?"в цепочке · "+(inChain+1):F.note;
    b.addEventListener("click",()=>{
      if(inChain>=0){sel=inChain;renderAll();return}
      const item={id,on:true,p:defaults(id)};
      if(F.geo){let at=chain.findIndex(c=>!FILTERS[c.id].geo||FILTERS[c.id].geo>F.geo);if(at<0)at=chain.length;chain.splice(at,0,item);sel=at}
      else{chain.push(item);sel=chain.length-1}
      if(F.geo)ensureNet();
      changed(true);
    });
    box.appendChild(b);
  });
}
function renderAll(){renderChain();renderPanel();renderLib();refresh()}
function changed(structural){persist();if(structural)renderAll();runSoon()}
function refresh(){
  const ph=photos[cur], all=photos.length&&photos.every(p=>p.out&&p.out.gen===gen);
  $("delOne").disabled=!ph;
  $("saveOne").disabled=!(ph&&ph.out&&ph.out.gen===gen)||!downloads;
  $("saveAll").disabled=!all||!downloads||photos.length<2;
  $("saveAll").textContent=photos.length>1?"Все "+photos.length+" (zip)":"Все (zip)";
  if(ph&&ph.out)$("rbadge").textContent=(suffix()||"без фильтров")+" · "+ph.out.w+"×"+ph.out.h;
}

/* ---------- сохранение ---------- */
async function offer(filename,data){
  if(!downloads){setStatus("Сохранение доступно на странице в claude.ai");return}
  try{await downloads.save({filename,data});setStatus("Сохранено: "+filename)}
  catch(e){const c=e&&e.code;setStatus(c==="declined"?"Сохранение отменено":c==="rate_limited"?"Окно сохранения уже открыто":"Не удалось сохранить, попробуй ещё раз")}
}
$("saveOne").addEventListener("click",()=>{const ph=photos[cur];if(ph&&ph.out)offer(outName(ph),ph.out.blob)});
/* ---------- удаление фото ---------- */
let delArm=0;
function removePhoto(i){
  const ph=photos[i];if(!ph)return;
  if(cropping)closeCrop(false);
  ph.el.remove();photos.splice(i,1);
  if(ph.out&&ph.out.url)URL.revokeObjectURL(ph.out.url);
  if(ph.origUrl)URL.revokeObjectURL(ph.origUrl);
  ph.out=null;ph.origUrl=null;ph.src=null;ph.bmp=null;ph.mask=undefined;
  queue=queue.filter(x=>x!==ph.id);
  select(photos.length?Math.min(i,photos.length-1):-1);
  setStatus(photos.length?"Фото удалено. Осталось: "+photos.length:"Добавь фото");
  refresh();
}
$("delOne").addEventListener("click",()=>{
  const b=$("delOne"), i=cur;if(!photos[i])return;
  if(delArm!==i+1){
    delArm=i+1;b.textContent="Точно удалить?";clearTimeout(b._t);
    b._t=setTimeout(()=>{delArm=0;b.textContent="Удалить"},3000);return;
  }
  clearTimeout(b._t);delArm=0;b.textContent="Удалить";removePhoto(i);
});
$("saveAll").addEventListener("click",async()=>{
  if(window.LAB_SAVE_MANY){try{await window.LAB_SAVE_MANY(photos.map(ph=>({filename:outName(ph),data:ph.out.blob})));setStatus("Сохранено: "+photos.length+" фото")}catch(e){setStatus(e&&e.code==="declined"?"Сохранение отменено":"Не удалось сохранить")}return}
  if(typeof JSZip==="undefined"){setStatus("Архиватор не загрузился, обнови страницу");return}
  setStatus("Собираю архив…",true);
  const zip=new JSZip(), used={};
  for(const ph of photos){let n=outName(ph);used[n]=(used[n]||0)+1;if(used[n]>1)n=n.replace(/\.jpg$/,"-"+used[n]+".jpg");zip.file(n,ph.out.blob)}
  const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
  const d=new Date(),ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  await offer("lab_"+ds+".zip",blob);
});
(async()=>{try{downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){downloads=null}refresh()})();

/* ---------- ввод ---------- */
$("size").addEventListener("change",e=>{ratio=e.target.value;persist();if(RATIOS[ratio].w&&photos[cur])openCrop();else{closeCrop(false);run()}});
$("add").addEventListener("click",()=>$("file").click());
$("empty").addEventListener("click",()=>$("file").click());
$("file").addEventListener("change",e=>{addFiles(e.target.files);e.target.value=""});
const stage=$("stage");
const on=()=>{if(cropping)return;if(photos[cur]&&photos[cur].origUrl)stage.classList.add("peek")},off=()=>stage.classList.remove("peek");
stage.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(t=>stage.addEventListener(t,off));
stage.addEventListener("contextmenu",e=>e.preventDefault());
stage.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();on()}});stage.addEventListener("keyup",off);
["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
document.addEventListener("paste",e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])];if(f.length)addFiles(f)});

/* ---------- старт с примером ---------- */
renderAll();
/* ---------- кадрирование: сдвиг и масштаб ---------- */
let cropping=false;const cv=$("cropcv"),ptrs=new Map();let pinch=null;
function frameBox(){const r=stage.getBoundingClientRect(),R=RATIOS[ratio],a=R.w/R.h;let fw=r.width,fh=fw/a;if(fh>r.height){fh=r.height;fw=fh*a}return{r,fw,fh,fx:(r.width-fw)/2,fy:(r.height-fh)/2}}
function drawCrop(){
  const ph=photos[cur];if(!cropping||!ph)return;const b=frameBox(),d=window.devicePixelRatio||1;
  cv.width=Math.round(b.r.width*d);cv.height=Math.round(b.r.height*d);const x=cv.getContext("2d");x.setTransform(d,0,0,d,0,0);
  const c=cropRect(ph),cr=ph.crop,s=b.fw/c.w;
  x.fillStyle="#000";x.fillRect(0,0,b.r.width,b.r.height);
  x.globalAlpha=.35;x.drawImage(ph.bmp,cr.x,cr.y,cr.w,cr.h,b.fx-(c.x-cr.x)*s,b.fy-(c.y-cr.y)*s,cr.w*s,cr.h*s);x.globalAlpha=1;
  x.drawImage(ph.bmp,c.x,c.y,c.w,c.h,b.fx,b.fy,b.fw,b.fh);
  x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=1.5;x.strokeRect(b.fx+.75,b.fy+.75,b.fw-1.5,b.fh-1.5);
  x.strokeStyle="rgba(255,255,255,.25)";x.lineWidth=1;x.beginPath();
  for(let i=1;i<3;i++){x.moveTo(b.fx+b.fw*i/3,b.fy);x.lineTo(b.fx+b.fw*i/3,b.fy+b.fh);x.moveTo(b.fx,b.fy+b.fh*i/3);x.lineTo(b.fx+b.fw,b.fy+b.fh*i/3)}x.stroke();
  $("zoom").value=ph.view.z;$("zoomOut").textContent=Math.round(ph.view.z*100)+"%";
}
function openCrop(){if(!photos[cur])return;cropping=true;stage.classList.add("cropping");cv.hidden=false;$("cropBar").hidden=false;$("hint").hidden=true;drawCrop()}
function closeCrop(apply){if(!cropping)return;cropping=false;stage.classList.remove("cropping");cv.hidden=true;$("cropBar").hidden=true;$("hint").hidden=!photos[cur];ptrs.clear();pinch=null;if(apply)run()}
function setZoom(z,px,py){const ph=photos[cur];if(!ph)return;const v=ph.view,b=frameBox(),c0=cropRect(ph);
  z=Math.min(4,Math.max(1,z));
  if(px!==undefined){const sx=c0.x+(px-b.fx)/b.fw*c0.w,sy=c0.y+(py-b.fy)/b.fh*c0.h,k=v.z/z,cr=ph.crop;
    const ncx=sx-(sx-(c0.x+c0.w/2))*k,ncy=sy-(sy-(c0.y+c0.h/2))*k;v.cx=(ncx-cr.x)/cr.w;v.cy=(ncy-cr.y)/cr.h}
  v.z=z;drawCrop()}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:photos[cur].view.z}}});
cv.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;const ph=photos[cur];if(!ph)return;
  if(ptrs.size===1){const b=frameBox(),c=cropRect(ph),dx=(e.clientX-p.x)/b.fw*c.w,dy=(e.clientY-p.y)/b.fh*c.h;
    ph.view.cx-=dx/ph.crop.w;ph.view.cy-=dy/ph.crop.h;p.x=e.clientX;p.y=e.clientY;drawCrop()}
  else if(ptrs.size===2&&pinch){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()],r=stage.getBoundingClientRect();
    setZoom(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null}));
cv.addEventListener("wheel",e=>{e.preventDefault();const r=stage.getBoundingClientRect();setZoom(photos[cur].view.z*Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zoom").addEventListener("input",e=>{const b=frameBox();setZoom(+e.target.value,b.fx+b.fw/2,b.fy+b.fh/2)});
$("cropBtn").addEventListener("click",openCrop);
$("cropReset").addEventListener("click",()=>{if(photos[cur]){photos[cur].view={z:1,cx:.5,cy:.5};drawCrop()}});
$("cropDone").addEventListener("click",()=>closeCrop(true));
window.addEventListener("resize",drawCrop);
showCurrent();setStatus("Добавь фото");
})();
</script>
